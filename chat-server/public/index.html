<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-time Chat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            width: 90%;
            max-width: 800px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .status {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }

        .room-section {
            padding: 20px;
            background: #f7f9fc;
            border-bottom: 1px solid #e0e0e0;
        }

        .room-input-group {
            display: flex;
            gap: 10px;
        }

        .room-input-group input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .room-input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f7f9fc;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message-user {
            background: #667eea;
            color: white;
            margin-left: auto;
            text-align: right;
        }

        .message-other {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .message-system {
            background: #fef3c7;
            color: #92400e;
            margin: 10px auto;
            text-align: center;
            font-size: 13px;
            max-width: 80%;
        }

        .message-sender {
            font-weight: 600;
            font-size: 12px;
            margin-bottom: 4px;
            opacity: 0.8;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
        }

        .input-section {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .message-input-group {
            display: flex;
            gap: 10px;
        }

        .message-input-group textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            height: 50px;
        }

        .message-input-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .current-room-info {
            font-size: 13px;
            color: #666;
            margin-bottom: 10px;
        }

        .hidden {
            display: none !important;
        }

        .online {
            color: #10b981;
        }

        .offline {
            color: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Real-time Chat</h1>
            <div class="status" id="status">연결 중...</div>
            <div class="status" id="nickname"></div>
        </div>

        <div class="room-section">
            <div class="room-input-group">
                <input type="text" id="roomInput" placeholder="Room ID를 입력하세요 (예: room1)" />
                <button class="btn btn-primary" id="joinBtn">입장</button>
                <button class="btn btn-danger hidden" id="leaveBtn">퇴장</button>
            </div>
            <div class="current-room-info hidden" id="currentRoomInfo"></div>
        </div>

        <div class="messages" id="messages">
            <div class="message message-system">
                Room에 입장하여 채팅을 시작하세요
            </div>
        </div>

        <div class="input-section">
            <div class="message-input-group">
                <textarea id="messageInput" placeholder="메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)" disabled></textarea>
                <button class="btn btn-primary" id="sendBtn" disabled>전송</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        // DOM Elements
        const statusEl = document.getElementById('status');
        const nicknameEl = document.getElementById('nickname');
        const roomInput = document.getElementById('roomInput');
        const joinBtn = document.getElementById('joinBtn');
        const leaveBtn = document.getElementById('leaveBtn');
        const messagesEl = document.getElementById('messages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const currentRoomInfo = document.getElementById('currentRoomInfo');

        // State
        let socket;
        let currentRoom = null;
        let myNickname = null;

        // Initialize Socket.IO connection
        function initSocket() {
            socket = io('http://localhost:8000', {
                transports: ['websocket', 'polling']
            });

            // Connection events
            socket.on('connect', () => {
                console.log('Connected to server');
                statusEl.textContent = '연결됨';
                statusEl.className = 'status online';

                // Restore last room if exists
                const lastRoom = localStorage.getItem('lastRoom');
                if (lastRoom) {
                    roomInput.value = lastRoom;
                }
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                statusEl.textContent = '연결 끊김';
                statusEl.className = 'status offline';
            });

            // Nickname assignment
            socket.on('nickname_assigned', (data) => {
                myNickname = data.nickname;
                nicknameEl.textContent = `닉네임: ${myNickname}`;
                console.log('Assigned nickname:', myNickname);
            });

            // Room events
            socket.on('room_joined', (data) => {
                currentRoom = data.roomId;
                localStorage.setItem('lastRoom', currentRoom);

                // Update UI
                roomInput.disabled = true;
                joinBtn.classList.add('hidden');
                leaveBtn.classList.remove('hidden');
                messageInput.disabled = false;
                sendBtn.disabled = false;

                currentRoomInfo.textContent = `현재 방: ${currentRoom} (참여자: ${data.userCount}명)`;
                currentRoomInfo.classList.remove('hidden');

                // Clear and load history
                messagesEl.innerHTML = '';
                if (data.history && data.history.length > 0) {
                    data.history.forEach(msg => displayMessage(msg));
                }

                console.log('Joined room:', currentRoom);
            });

            socket.on('room_left', (data) => {
                currentRoom = null;
                localStorage.removeItem('lastRoom');

                // Update UI
                roomInput.disabled = false;
                joinBtn.classList.remove('hidden');
                leaveBtn.classList.add('hidden');
                messageInput.disabled = true;
                sendBtn.disabled = true;

                currentRoomInfo.classList.add('hidden');
                messagesEl.innerHTML = '<div class="message message-system">Room에 입장하여 채팅을 시작하세요</div>';

                console.log('Left room');
            });

            // Message events
            socket.on('new_message', (message) => {
                displayMessage(message);
            });

            socket.on('user_count_updated', (data) => {
                if (currentRoom) {
                    currentRoomInfo.textContent = `현재 방: ${currentRoom} (참여자: ${data.userCount}명)`;
                }
            });

            // Error handling
            socket.on('error', (data) => {
                alert('오류: ' + data.message);
                console.error('Server error:', data.message);
            });
        }

        // Display a message in the chat
        function displayMessage(msg) {
            const div = document.createElement('div');
            div.className = 'message';

            if (msg.message_type === 'system') {
                div.className += ' message-system';
                div.textContent = msg.text;
            } else {
                const isMyMessage = msg.sender === myNickname;
                div.className += isMyMessage ? ' message-user' : ' message-other';

                if (!isMyMessage) {
                    const senderDiv = document.createElement('div');
                    senderDiv.className = 'message-sender';
                    senderDiv.textContent = msg.sender;
                    div.appendChild(senderDiv);
                }

                const textDiv = document.createElement('div');
                textDiv.textContent = msg.text;
                div.appendChild(textDiv);

                const timeDiv = document.createElement('div');
                timeDiv.className = 'message-time';
                timeDiv.textContent = formatTime(msg.timestamp);
                div.appendChild(timeDiv);
            }

            messagesEl.appendChild(div);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        // Format timestamp
        function formatTime(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
        }

        // Join room
        function joinRoom() {
            const roomId = roomInput.value.trim();
            if (!roomId) {
                alert('Room ID를 입력하세요');
                return;
            }

            socket.emit('join_room', { roomId });
        }

        // Leave room
        function leaveRoom() {
            if (currentRoom) {
                socket.emit('leave_room', { roomId: currentRoom });
            }
        }

        // Send message
        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentRoom) {
                return;
            }

            socket.emit('send_message', {
                roomId: currentRoom,
                text: text
            });

            messageInput.value = '';
            messageInput.focus();
        }

        // Event Listeners
        joinBtn.addEventListener('click', joinRoom);
        leaveBtn.addEventListener('click', leaveRoom);
        sendBtn.addEventListener('click', sendMessage);

        roomInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                joinRoom();
            }
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Clean up on page unload
        window.addEventListener('beforeunload', () => {
            if (currentRoom) {
                socket.emit('leave_room', { roomId: currentRoom });
            }
        });

        // Initialize
        initSocket();
    </script>
</body>
</html>
